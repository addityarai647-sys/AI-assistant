<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aivora | AI Assistant</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar" id="sidebar">

        <!-- Logo -->
        <div class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-sparkles"></i>
            </div>

            <span>Aivora</span>
        </div>

        <!-- New Chat -->
        <button class="new-chat-btn" id="newChatBtn">
            <i class="fa-solid fa-plus"></i>
            <span>New Chat</span>
        </button>

        <!-- Recent Chats -->
        <div class="sidebar-section">

            <p class="sidebar-title">
                Recent Chats
            </p>

            <div class="recent-chats" id="recentChats">
                <!-- Chats will appear here using JavaScript -->
            </div>

        </div>

        <!-- Sidebar Bottom -->
        <div class="sidebar-bottom">

            <!-- Settings -->
            <button class="sidebar-btn" id="settingsBtn">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </button>

            <!-- Help -->
            <button class="sidebar-btn" id="helpBtn">
                <i class="fa-solid fa-circle-question"></i>
                <span>Help</span>
            </button>

            <!-- User -->
            <div class="user-profile">

                <div class="user-avatar">
                    AR
                </div>

                <div class="user-info">
                    <strong>Aditya Rai</strong>
                    <small>Free Plan</small>
                </div>

            </div>

        </div>

    </aside>


    <!-- ================= MAIN ================= -->
    <main class="main">

        <!-- Header -->
        <header class="header">

            <div class="header-left">

                <!-- Mobile Menu -->
                <button
                    class="mobile-menu"
                    id="mobileMenu"
                    aria-label="Open menu"
                >
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div>

                    <h2>
                        Aivora
                    </h2>

                    <div class="status">

                        <span class="status-dot"></span>

                        <span>
                            Online
                        </span>

                    </div>

                </div>

            </div>


            <!-- Header Actions -->
            <div class="header-actions">

                <!-- Theme -->
                <button
                    id="themeBtn"
                    class="icon-btn"
                    title="Toggle theme"
                >
                    <i class="fa-solid fa-moon"></i>
                </button>

                <!-- New Chat -->
                <button
                    id="headerNewChat"
                    class="header-new-chat"
                >
                    <i class="fa-solid fa-plus"></i>

                    <span>
                        New Chat
                    </span>
                </button>

            </div>

        </header>


        <!-- ================= CHAT AREA ================= -->
        <section
            class="chat-area"
            id="chatArea"
        >

            <!-- Welcome Screen -->
            <div
                class="welcome"
                id="welcome"
            >

                <!-- Welcome Icon -->
                <div class="welcome-icon">
                    <i class="fa-solid fa-sparkles"></i>
                </div>


                <h1>
                    How can I help you today?
                </h1>


                <p>
                    I'm Aivora, your personal AI assistant.
                    Ask me anything.
                </p>


                <!-- Suggestions -->
                <div class="suggestions">

                    <!-- Suggestion 1 -->
                    <button
                        class="suggestion-card"
                        data-prompt="Explain artificial intelligence in simple words"
                    >

                        <i class="fa-solid fa-brain"></i>

                        <div>

                            <strong>
                                Learn something
                            </strong>

                            <span>
                                Explain AI in simple words
                            </span>

                        </div>

                    </button>


                    <!-- Suggestion 2 -->
                    <button
                        class="suggestion-card"
                        data-prompt="Give me a JavaScript project idea"
                    >

                        <i class="fa-solid fa-code"></i>

                        <div>

                            <strong>
                                Write code
                            </strong>

                            <span>
                                Give me a JavaScript project idea
                            </span>

                        </div>

                    </button>


                    <!-- Suggestion 3 -->
                    <button
                        class="suggestion-card"
                        data-prompt="Give me a productivity plan for today"
                    >

                        <i class="fa-solid fa-list-check"></i>

                        <div>

                            <strong>
                                Plan my day
                            </strong>

                            <span>
                                Create a productivity plan
                            </span>

                        </div>

                    </button>


                    <!-- Suggestion 4 -->
                    <button
                        class="suggestion-card"
                        data-prompt="Give me some creative website ideas"
                    >

                        <i class="fa-solid fa-lightbulb"></i>

                        <div>

                            <strong>
                                Get ideas
                            </strong>

                            <span>
                                Creative website ideas
                            </span>

                        </div>

                    </button>

                </div>

            </div>


            <!-- Messages -->
            <div
                class="messages"
                id="messages"
            >
                <!-- User and AI messages will appear here -->
            </div>

        </section>


        <!-- ================= INPUT AREA ================= -->
        <div class="input-area">

            <div class="input-box">

                <!-- Attachment -->
                <button
                    class="input-btn"
                    id="attachBtn"
                    title="Attach file"
                >
                    <i class="fa-solid fa-paperclip"></i>
                </button>


                <!-- Message Input -->
                <textarea
                    id="messageInput"
                    placeholder="Message Aivora..."
                    rows="1"
                ></textarea>


                <!-- Microphone -->
                <button
                    class="input-btn"
                    id="micBtn"
                    title="Voice input"
                >
                    <i class="fa-solid fa-microphone"></i>
                </button>


                <!-- Send -->
                <button
                    class="send-btn"
                    id="sendBtn"
                    title="Send message"
                >
                    <i class="fa-solid fa-paper-plane"></i>
                </button>

            </div>


            <p class="input-note">
                Aivora can make mistakes. Check important information.
            </p>

        </div>

    </main>


    <!-- ================= JAVASCRIPT ================= -->
    <script src="script.js"></script>

</body>
</html>
